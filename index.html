<body>

    <option value="manager">مدیر</option>
    <option value="barber">آرایشگر</option>

  <button onclick="logout()">خروج</button>
</div>

<script>
  const SUPABASE_URL = "https://wguzfsmcgyhepmcjscsa.supabase.co";
  const SUPABASE_KEY = "sb_publishable_j3Ek16aqSiSxhIlDP9aYkw_BWfx-_nk";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const DEFAULT_USERS = [
    { name: "مدیر", username: "admin", password: "12345", role: "manager", active: true },
    { name: "مجید", password: "1234", role: "barber", active: true },
    { name: "علی", password: "2222", role: "barber", active: true },
    { name: "محمد رضا", password: "3333", role: "barber", active: true },
    { name: "محمد امین", password: "4444", role: "barber", active: true },
    { name: "محمد طاها", password: "5555", role: "barber", active: true },
    { name: "آریا", password: "1111", role: "barber", active: true }
  ];

  function getUsers() {
    const local = localStorage.getItem("salon_users");
    if (local) {
      try { 
        const users = JSON.parse(local);
        return users.map(u => ({ ...u, active: u.active !== false }));
      } catch(e){}
    }
    localStorage.setItem("salon_users", JSON.stringify(DEFAULT_USERS));
    return DEFAULT_USERS;
  }

  function saveUsers(users) {
    localStorage.setItem("salon_users", JSON.stringify(users));
  }

  let currentUser = null;
  let realtimeChannel = null;
  let adminSyncChannel = null;

  // پخش صدای هشدار برای مدیر
  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5 note
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  }

  // درخواست مجوز ارسال نوتیفیکیشن مرورگر
  function requestNotificationPermission() {
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }
  }

  function sendPushNotification(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3655/3655581.png' });
    }
  }

  // دریافت رمز مدیر از دیتابیس Supabase جهت اعتبارسنجی همگانی
  async function getAdminCredentials() {
    try {
      const { data, error } = await supabaseClient.from("app_settings").select("*").eq("key", "admin_config").single();
      if (data && data.value) {
        return data.value;
      }
    } catch(e) {}
    return { username: "admin", password: "12345" };
  }

  async function login() {
    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("loginMsg");
    msg.innerHTML = "در حال بررسی...";

    if (role === "manager") {
      const adminCreds = await getAdminCredentials();
      if (username === adminCreds.username && password === adminCreds.password) {
        currentUser = { name: "مدیر", username, password, role: "manager" };
        requestNotificationPermission();
        document.getElementById("loginBox").classList.add("hide");
        document.getElementById("managerBox").classList.remove("hide");
        loadManager();
        listenAdminPasswordChange();
        return;
      } else {
        msg.innerHTML = "نام کاربری یا رمز عبور مدیر اشتباه است";
        return;
      }
    }

    const users = getUsers();
    let found = users.find(u => u.role === "barber" && u.name === username && u.password === password);

    if (!found) {
      msg.innerHTML = "نام یا رمز اشتباه است";
      return;
    }

    if (found.active === false) {
      msg.innerHTML = "⚠️ حساب کاربری شما غیرفعال شده است. لطفا با مدیر تماس بگیرید.";
      return;
    }

    currentUser = found;
    document.getElementById("loginBox").classList.add("hide");
    document.getElementById("barberBox").classList.remove("hide");
    loadBarber();
  }

  function logout() { 
    if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
    if (adminSyncChannel) supabaseClient.removeChannel(adminSyncChannel);
    location.reload(); 
  }

  // شنود آنی تغییرات رمز مدیر (اگر روی گوشی دیگری عوض شد، بقیه لاگ اوت شوند)
  function listenAdminPasswordChange() {
    adminSyncChannel = supabaseClient
      .channel('public:app_settings')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings', filter: 'key=eq.admin_config' }, payload => {
        const newVal = payload.new ? payload.new.value : null;
        if (newVal && currentUser && currentUser.role === "manager") {
          if (newVal.username !== currentUser.username || newVal.password !== currentUser.password) {
            alert("⚠️ رمز یا اطلاعات ورود مدیر توسط دستگاه دیگری تغییر یافت. لطفا مجدداً وارد شوید.");
            logout();
          }
        }
      })
      .subscribe();
  }

  /* --- مدیریت آرایشگران --- */
  function openBarberManagement() {
    const container = document.getElementById("managerContent");
    const users = getUsers();
    const barbers = users.filter(u => u.role === "barber");

    let listHtml = "";
    barbers.forEach((b) => {
      const isInactive = b.active === false;
      listHtml += `
        <div class="card" style="background:${isInactive ? '#fff3f3' : 'white'}; border:1px solid ${isInactive ? '#ffcdd2' : '#ddd'}; margin-bottom:10px;">
          <div style="font-weight:bold; font-size:16px; color:#222; margin-bottom:5px;">
            💈 ${b.name}
            ${isInactive ? '<span class="badge-disabled">غیرفعال</span>' : ''}
          </div>
          <div style="font-size:13px; color:#666; margin-bottom:10px;">🔑 رمز عبور فعلی: <code>${b.password}</code></div>
          <div class="flex">
            <button onclick="editBarberName('${b.name}')" class="btn-small" style="background:#f57c00;">✏️ ویرایش نام</button>
            <button onclick="editBarberPassword('${b.name}')" class="btn-small" style="background:#0288d1;">🔑 ویرایش رمز</button>
            <button onclick="toggleBarberStatus('${b.name}')" class="btn-small" style="background:${isInactive ? '#2e7d32' : '#d32f2f'};">
              ${isInactive ? '✅ فعال‌سازی' : '🚫 غیرفعال‌سازی ورود'}
            </button>
            <button onclick="executeDeleteBarber('${b.name}')" class="btn-small" style="background:#7f0000;">🗑️ حذف کامل و پاکسازی سوابق</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = `
      <button onclick="renderManagerPending()" class="btn-small">🔙 بازگشت به داشبورد</button>
      <div class="card" style="background:#e8f5e9; border:1px solid #a5d6a7;">
        <h3>✂️ مدیریت آرایشگران</h3>
        <button onclick="openAddBarberModal()" style="background:#2e7d32; width:100%; margin-bottom:15px;">➕ افزودن آرایشگر جدید</button>
        <div style="text-align:right;">
          <strong>لیست آرایشگران:</strong>
          ${listHtml || "<div style='color:#777; margin-top:10px;'>هیچ آرایشگری وجود ندارد</div>"}
        </div>
      </div>
    `;
  }

  function toggleBarberStatus(barberName) {
    const users = getUsers();
    const barber = users.find(u => u.name === barberName && u.role === "barber");
    if (!barber) return;

    const currentStatus = barber.active !== false;
    const actionText = currentStatus ? "غیرفعال" : "فعال";

    if (confirm(`آیا مطمئن هستید که می‌خواهید دسترسی ورود "${barberName}" را ${actionText} کنید؟`)) {
      barber.active = !currentStatus;
      saveUsers(users);
      alert(`✅ دسترسی "${barberName}" با موفقیت ${actionText} شد.`);
      openBarberManagement();
    }
  }

  function openAddBarberModal() {
    const name = prompt("نام آرایشگر جدید را وارد کنید:");
    if (!name || !name.trim()) return;
    const password = prompt("رمز عبور آرایشگر جدید را وارد کنید:");
    if (!password || !password.trim()) return;

    const users = getUsers();
    if (users.some(u => u.name === name.trim() && u.role === "barber")) {
      alert("⚠️ آرایشگری با این نام قبلاً وجود دارد");
      return;
    }

    users.push({ name: name.trim(), password: password.trim(), role: "barber", active: true });
    saveUsers(users);
    alert("✅ آرایشگر جدید اضافه شد");
    openBarberManagement();
  }

  async function editBarberName(oldName) {
    const users = getUsers();
    const barber = users.find(u => u.name === oldName && u.role === "barber");
    if (!barber) return;

    const newName = prompt("نام جدید آرایشگر را وارد کنید:", barber.name);
    if (!newName || !newName.trim()) return;

    const trimmedName = newName.trim();

    if (trimmedName === oldName) return;

    if (users.some(u => u.name === trimmedName && u.role === "barber")) {
      alert("⚠️ این نام قبلاً برای آرایشگر دیگری انتخاب شده است");
      return;
    }

    const uIdx = users.findIndex(u => u.name === oldName && u.role === "barber");
    if (uIdx !== -1) {
      users[uIdx].name = trimmedName;
      saveUsers(users);
    }

    try {
      await supabaseClient.from("works").update({ barber: trimmedName }).eq("barber", oldName);
      await supabaseClient.from("payments").update({ barber: trimmedName }).eq("barber", oldName);
    } catch(e) {
      console.error("خطا در به‌روزرسانی سوابق آرایشگر:", e);
    }

    alert("✅ نام آرایشگر با موفقیت به‌روزرسانی شد");
    openBarberManagement();
  }

  function editBarberPassword(barberName) {
    const users = getUsers();
    const barber = users.find(u => u.name === barberName && u.role === "barber");
    if (!barber) return;

    const newPassword = prompt(`رمز عبور جدید برای "${barberName}" را وارد کنید:`, barber.password);
    if (!newPassword || !newPassword.trim()) return;

    const uIdx = users.findIndex(u => u.name === barberName && u.role === "barber");
    if (uIdx !== -1) {
      users[uIdx].password = newPassword.trim();
      saveUsers(users);
    }

    alert("✅ رمز عبور آرایشگر با موفقیت تغییر یافت");
    openBarberManagement();
  }

  async function executeDeleteBarber(barberName) {
    if (!confirm(`🚨 هشدار شدید!\nآیا از حذف کامل "${barberName}" مطمئن هستید؟`)) return;

    const users = getUsers();
    const updatedUsers = users.filter(u => !(u.name === barberName && u.role === "barber"));
    saveUsers(updatedUsers);

    try {
      await supabaseClient.from("works").delete().eq("barber", barberName);
      await supabaseClient.from("payments").delete().eq("barber", barberName);
    } catch(e) {
      console.error("خطا در حذف کارهای دیتابیس:", e);
    }

    alert("🗑️ آرایشگر و تمامی سوابق او به‌طور کامل پاک شدند");
    openBarberManagement();
  }

  /* --- مدیریت خدمات --- */
  async function openServiceManagement() {
    const container = document.getElementById("managerContent");
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری خدمات...</div>';

    const services = await getServices();
    let servicesHtml = "";

    services.forEach((s, index) => {
      servicesHtml += `
        <div class="card" style="background:white; border:1px solid #ddd; margin-bottom:8px;">
          <div style="font-weight:bold; font-size:15px;">${s.name}</div>
          <div style="color:#2e7d32; font-size:14px; margin:4px 0;">💰 ${s.price.toLocaleString()} تومان</div>
          <div class="flex">
            <button onclick="editServiceNameOnly(${index})" class="btn-small" style="background:#f57c00;">✏️ ویرایش نام</button>
            <button onclick="editServicePriceOnly(${index})" class="btn-small" style="background:#0288d1;">💰 ویرایش قیمت</button>
            <button onclick="deleteSingleService(${index})" class="btn-small" style="background:#c62828;">🗑️ حذف</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = `
      <button onclick="renderManagerPending()" class="btn-small">🔙 بازگشت به داشبورد</button>
      <div class="card" style="background:#eef6ff; border:1px solid #bbdefb;">
        <h3>✂️ مدیریت خدمات سالن</h3>
        <button onclick="addNewServicePrompt()" style="background:#2e7d32; width:100%; margin-bottom:15px;">➕ افزودن خدمت جدید</button>
        <div style="text-align:right;">
          <strong>لیست خدمات فعال:</strong>
          ${servicesHtml || "<div style='color:#777; margin-top:10px;'>هیچ خدمتی وجود ندارد</div>"}
        </div>
      </div>
    `;
  }

  async function addNewServicePrompt() {
    const name = prompt("نام خدمت جدید را وارد کنید:");
    if (!name || !name.trim()) return;
    const price = prompt("قیمت خدمت (تومان):");
    if (!price || isNaN(Number(price))) return;

    const list = await getServices();
    list.push({ name: name.trim(), price: Number(price) });
    if (await saveServices(list)) {
      alert("✅ خدمت جدید اضافه شد");
      openServiceManagement();
    }
  }

  async function editServiceNameOnly(index) {
    const list = await getServices();
    if (!list[index]) return;

    const current = list[index];
    const newName = prompt("نام جدید خدمت را وارد کنید:", current.name);
    if (!newName || !newName.trim()) return;

    list[index].name = newName.trim();
    if (await saveServices(list)) {
      alert("✅ نام خدمت با موفقیت به‌روزرسانی شد");
      openServiceManagement();
    }
  }

  async function editServicePriceOnly(index) {
    const list = await getServices();
    if (!list[index]) return;

    const current = list[index];
    const newPrice = prompt("قیمت جدید خدمت را وارد کنید (تومان):", current.price);
    if (!newPrice || isNaN(Number(newPrice))) return;

    list[index].price = Number(newPrice);
    if (await saveServices(list)) {
      alert("✅ قیمت خدمت با موفقیت به‌روزرسانی شد");
      openServiceManagement();
    }
  }

  async function deleteSingleService(index) {
    const list = await getServices();
    if (!list[index]) return;

    if (confirm(`آیا از حذف خدمت "${list[index].name}" مطمئن هستید؟`)) {
      list.splice(index, 1);
      if (await saveServices(list)) {
        alert("🗑️ خدمت حذف شد");
        openServiceManagement();
      }
    }
  }

  // آنلاین‌سازی تغییر اطلاعات مدیر جهت تغییر آنی روی همه گوشی‌ها
  async function editManagerCredentials() {
    const currentAdmin = await getAdminCredentials();
    const newUsername = prompt("نام کاربری جدید مدیر را وارد کنید:", currentAdmin.username);
    if (!newUsername) return;
    const newPassword = prompt("رمز عبور جدید مدیر را وارد کنید:", currentAdmin.password);
    if (!newPassword) return;

    const updatedConfig = { username: newUsername.trim(), password: newPassword.trim() };

    try {
      const { error } = await supabaseClient.from("app_settings").upsert({ key: "admin_config", value: updatedConfig });
      if (error) throw error;
      alert("✅ اطلاعات مدیر با موفقیت آنلاین به‌روزرسانی شد.\nتمامی گوشی‌های فعال اخراج می‌شوند تا با رمز جدید وارد شوند.");
      logout();
    } catch(e) {
      alert("❌ خطا در ذخیره آنلاین اطلاعات مدیر: " + e.message);
    }
  }

  const DEFAULT_SERVICES = [
    { name: "اصلاح ساده", price: 300000 },
    { name: "اصلاح مدل دار", price: 400000 },
    { name: "سایه صفر", price: 500000 },
    { name: "فید", price: 600000 },
    { name: "صورت با ماشین", price: 100000 },
    { name: "صورت با تیغ", price: 200000 },
    { name: "صورت سایه", price: 150000 },
    { name: "وکس", price: 150000 },
    { name: "شستشو", price: 100000 },
    { name: "سشوار", price: 150000 }
  ];

  async function getServices() {
    try {
      const { data } = await supabaseClient.from("services").select("list").eq("id", 1).single();
      if (data && data.list && data.list.length > 0) return data.list;
    } catch (e) {}
    await saveServices(DEFAULT_SERVICES);
    return DEFAULT_SERVICES;
  }

  async function saveServices(list) {
    try {
      const { error } = await supabaseClient.from("services").upsert({ id: 1, list: list });
      if (error) throw error;
      return true;
    } catch (e) {
      alert("❌ خطا در ذخیره‌سازی: " + e.message);
      return false;
    }
  }

  function now() {
    const d = new Date();
    return {
      date: d.toLocaleDateString("fa-IR"),
      time: d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" }),
      dateKey: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0")
    };
  }

  function normalizeDate(d) {
    if (!d) return "";
    d = d.replace(/[۰-۹]/g, x => "۰۱۲۳۴۵۶۷۸۹".indexOf(x));
    d = d.replace(/\//g, "-");
    const p = d.split("-");
    if (p.length === 3) { p[1] = p[1].padStart(2,"0"); p[2] = p[2].padStart(2,"0"); }
    return p.join("-");
  }

  function toggleVisibility(id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.toggle("hide");
    }
  }

  async function saveWork() {
    const services = await getServices();
    const selected = [];
    services.forEach((s, i) => {
      const box = document.getElementById("service" + i);
      if (box && box.checked) selected.push(s);
    });

    const extraAmountInput = document.getElementById("extraAmount");
    const extraAmount = extraAmountInput ? Number(extraAmountInput.value) || 0 : 0;

    if (selected.length === 0 && extraAmount === 0) { 
      alert("لطفاً حداقل یک خدمت یا مبلغ اضافی وارد کنید"); 
      return; 
    }
    
    if (extraAmount > 0) {
      selected.push({ name: "مبلغ اضافی / انعام", price: extraAmount });
    }

    const total = selected.reduce((sum, s) => sum + s.price, 0);
    const n = now();
    const work = {
      barber: currentUser.name,
      services: selected,
      total: total,
      date: n.date,
      date_key: n.dateKey,

  async function saveWorkByManager() {
    const targetBarber = document.getElementById("mgrTargetBarber").value;
    if (!targetBarber) {
      alert("لطفاً یک آرایشگر انتخاب کنید");
      return;
    }

    const services = await getServices();
    const selected = [];
    
    services.forEach((s, i) => {
      const box = document.getElementById("mgrService" + i);
      if (box && box.checked) selected.push(s);
    });

    const extraAmountInput = document.getElementById("mgrExtraAmount");
    const extraAmount = extraAmountInput ? Number(extraAmountInput.value) || 0 : 0;

    if (selected.length === 0 && extraAmount === 0) { 
      alert("لطفاً حداقل یک خدمت یا مبلغ اضافی انتخاب کنید");

    if (extraAmount > 0) {

    const n = now();
    
    const work = {

      services: selected,
      total: total,
      date: n.date,
      date_key: n.dateKey,
      time: n.time,
      status: "approved"

      if (error) throw error;

  async function exportExcel() {
    try {
      const works = await getAllWorks("approved");
      const payments = await getPayments();
      
      let rows1 = [["آرایشگر", "تاریخ", "ساعت", "خدمات", "مبلغ (تومان)"]];
      works.forEach(w => {
        rows1.push([w.barber, w.date, w.time, w.services.map(s => s.name).join(" - "), w.total]);
      });

      let rows2 = [["آرایشگر", "مبلغ", "نوع (تسویه/اضافه به طلب/جریمه)", "توضیحات", "تاریخ", "ساعت"]];
      payments.forEach(p => {
        let pType = p.type === "penalty" ? "جریمه" : (p.type === "credit" ? "افزایش طلب/پاداش" : "تسویه/پرداخت");
        rows2.push([p.barber, Math.abs(p.amount), pType, p.reason || "", p.date || "", p.time || ""]);
      });

      let rows3 = [["آرایشگر", "سهم از کارکرد (۵۰٪)", "تسویه شده / کسورات", "افزایش طلب / پاداش", "مانده طلب"]];
      const accountData = {};
      
      works.forEach(w => {
        if (!accountData[w.barber]) accountData[w.barber] = { share: 0, paid: 0, credit: 0 };
        accountData[w.barber].share += w.total * 0.5;
      });
      
      payments.forEach(p => {
        if (!accountData[p.barber]) accountData[p.barber] = { share: 0, paid: 0, credit: 0 };
        if (p.type === "credit") {
          accountData[p.barber].credit += p.amount;
        } else if (p.type === "payment") {
          accountData[p.barber].paid += p.amount;
        } else if (p.type === "penalty") {
          accountData[p.barber].paid += Math.abs(p.amount);
        }
      });

      for (let b in accountData) {
        const totalDebt = (accountData[b].share + accountData[b].credit) - accountData[b].paid;
        rows3.push([b, accountData[b].share, accountData[b].paid, accountData[b].credit, totalDebt]);
      }

      const book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, XLSX.utils.aoa_to_sheet(rows1), "گزارش کارها");
      XLSX.utils.book_append_sheet(book, XLSX.utils.aoa_to_sheet(rows2), "پرداختی‌ها و جریمه‌ها");
      XLSX.utils.book_append_sheet(book, XLSX.utils.aoa_to_sheet(rows3), "حساب آرایشگرها");
      
      const wbout = XLSX.write(book, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      
      const blobUrl = URL.createObjectURL(blob);
      const downloadLink = document.createElement("a");
      downloadLink.href = blobUrl;
      downloadLink.download = "گزارش_صندوق_آرایشگاه.xlsx";
      
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

    } catch(e) {
      alert("❌ خطا در ساخت اکسل: " + e.message);
    }
  }

            playNotificationSound();
            sendPushNotification("🔔 خدمت جدید در انتظار تأیید", `آرایشگر: ${payload.new.barber} - مبلغ: ${payload.new.total ? payload.new.total.toLocaleString() : 0} تومان`);

          renderManagerPending();

    }

          todayWorksListHtml = "<div style='font-size:12px; color:#777;'>امروز هیچ کاری ثبت نشده است</div>";
        }

        todayReportHtml += `
          <div style="background:white; padding:10px; margin:8px 0; border-radius:8px; text-align:right; border-right: 4px solid #2e7d32;">
            <strong>💈 ${bName}</strong> ${isInactive ? '<span class="badge-disabled">غیرفعال</span>' : ''}<br>
            🧾 مشتری امروز: ${tData.count} نفر | ✂️ خدمات: ${tData.services}<br>
            💰 فروش امروز: <strong>${tData.money.toLocaleString()}</strong> تومان<br>
            👤 سهم امروز آرایشگر (۵۰٪): <strong>${tShare.toLocaleString()}</strong> تومان
            
            <div style="margin-top:6px;">
              <button onclick="toggleVisibility('${todayWorksContainerId}')" class="btn-small" style="background:#388e3c; width:100%; font-size:12px; padding:5px;">👁️ نمایش / مخفی‌سازی کارهای امروز (${tData.works.length})</button>
              <div id="${todayWorksContainerId}" class="hide" style="margin-top:5px;">
                ${todayWorksListHtml}
              </div>
            </div>
          </div>
        `;
      }
      todayReportHtml += `</div>`;

      let html = `
        <button onclick="renderManagerPending()" class="btn-small">🔙 بازگشت به داشبورد</button>
        <button onclick="exportExcel()" class="btn-small" style="background:#2e7d32;">📤 خروجی اکسل</button>
        
        <div class="card">
          <h2>📊 گزارش سابقه کل صندوق (از ابتدا)</h2>
          تعداد کل خدمات: ${count}<br>
          💰 فروش کل: ${total.toLocaleString()} تومان<br>
          👤 سهم آرایشگرها: ${(total*0.5).toLocaleString()} تومان<br>
          🏢 سهم سالن: ${(total*0.5).toLocaleString()} تومان
        </div>

        ${todayReportHtml}

        <div class="card" style="background:#eef6ff;">
          <h3>📅 گزارش بازه‌ای تاریخ</h3>
          <select id="mgrBarberSelect" style="margin-bottom:8px;">${barberOptions}</select>
          <input type="text" id="mgrFromDate" placeholder="از تاریخ">
          <input type="text" id="mgrToDate" placeholder="تا تاریخ">
          <button onclick="showManagerDateReport()">🔍 محاسبه کارکرد بازه</button>
          <div id="mgrDateReportResult"></div>
        </div>

        <h3>📋 حساب کلی آرایشگرها (سابقه کل)</h3>
      `;
      
      let index = 0;
      for (let b in barberData) {
        index++;
        const money = barberData[b].money;
        const workShare = money * 0.5;
        const extraCredit = creditMap[b] || 0;
        const totalShare = workShare + extraCredit;
        
        const paidAndDeducted = paidMap[b] || 0;
        const debt = totalShare - paidAndDeducted;
        
        const targetUser = barbers.find(u => u.name === b);
        const isInactive = targetUser && targetUser.active === false;
        
        const barberWorksList = allWorks.filter(w => w.barber === b);
        let worksListHtml = "";
        if (barberWorksList.length > 0) {
          barberWorksList.forEach(w => {
            worksListHtml += `
              <div style="font-size:12px; background:#fff; padding:6px; margin:4px 0; border-radius:5px; text-align:right;">
                ✂️ ${w.services.map(s => s.name).join(" - ")} (${w.total.toLocaleString()} ت)<br>
                <span style="color:#666; font-size:11px;">📅 ${w.date} - ⏰ ${w.time}</span>
                <div style="margin-top:4px;">
                  <button onclick="reassignWork(${w.id}, '${b}')" class="btn-small" style="background:#f57c00; padding:2px 6px; font-size:11px;">🔄 انتقال به دیگری</button>
                  <button onclick="deleteWork(${w.id})" class="btn-small" style="background:#c62828; padding:2px 6px; font-size:11px;">🗑️ حذف کار</button>
                </div>
              </div>
            `;
          });
        } else {
          worksListHtml = "<div style='font-size:12px; color:#777;'>هیچ کاری ثبت نشده است</div>";
        }

        const barberPayments = allPayments.filter(p => p.barber === b);
        let paymentsListHtml = "";
        if (barberPayments.length > 0) {
          barberPayments.forEach(p => {
            let amountText = "";
            let styleColor = "";

            if (p.type === "credit") {
              amountText = `➕ اضافه به طلب/پاداش: ${p.amount.toLocaleString()} تومان ${p.reason ? '(' + p.reason + ')' : ''}`;
              styleColor = `color: #1565c0; font-weight: bold;`;
            } else if (p.type === "penalty") {
              amountText = `🚨 جریمه: ${Math.abs(p.amount).toLocaleString()} تومان ${p.reason ? '(' + p.reason + ')' : ''}`;
              styleColor = `color: #d32f2f; font-weight: bold;`;
            } else {
              amountText = `💵 تسویه/پرداخت: ${p.amount.toLocaleString()} تومان`;
              styleColor = `color: #2e7d32;`;
            }

            paymentsListHtml += `
              <div style="font-size:12px; background:#fff; padding:5px; margin:3px 0; border-radius:5px; display:flex; justify-content:space-between; align-items:center;">
                <span style="${styleColor}">${amountText} (${p.date || 'بدون تاریخ'})</span>
                <button onclick="deletePayment(${p.id})" class="btn-small" style="background:#c62828; padding:2px 6px; font-size:11px;">🗑️ حذف</button>
              </div>
            `;
          });
        } else {
          paymentsListHtml = "<div style='font-size:12px; color:#777;'>هیچ تراکنش مالی ثبت نشده است</div>";
        }

        const worksContainerId = "worksContainer_" + index;
        const paymentsContainerId = "paymentsContainer_" + index;

        html += `
          <div class="card" style="background:${isInactive ? '#fafafa' : '#f4f4f4'}; border:${isInactive ? '1px dashed #e53935' : 'none'};">
            <h3>💈 ${b} ${isInactive ? '<span class="badge-disabled">غیرفعال</span>' : ''}</h3>
            ✂️ خدمات: ${barberData[b].services}<br>
            🧾 مشتری: ${barberData[b].count}<br>
            💰 کل فروش کارکرد: ${money.toLocaleString()} تومان<br>
            👤 سهم کارکرد (۵۰٪): ${workShare.toLocaleString()} تومان<br>
            ${extraCredit > 0 ? `➕ مبالغ اضافه شده به طلب: ${extraCredit.toLocaleString()} تومان<br>` : ''}
            💵 کل دریافتی‌ها و تسویه‌ها: ${paidAndDeducted.toLocaleString()} تومان<br>
            📌 طلب مانده فعلی: <strong>${debt.toLocaleString()}</strong> تومان<br><br>
            
            <div class="flex">
              <button onclick="addPayment('${b}')" class="btn-small" style="background:#2e7d32;">💵 تسویه حساب</button>
              <button onclick="addCredit('${b}')" class="btn-small" style="background:#1565c0;">➕ اضافه به طلب / پاداش</button>
              <button onclick="addPenalty('${b}')" class="btn-small" style="background:#c62828;">🚨 ثبت جریمه</button>
            </div>
            
            <div style="margin-top:10px; border-top:1px solid #ccc; padding-top:5px;">
              <button onclick="toggleVisibility('${worksContainerId}')" class="btn-small" style="background:#555; width:100%;">👁️ نمایش / مخفی‌سازی لیست کل کارهای مشتریان (${barberWorksList.length})</button>
              <div id="${worksContainerId}" class="hide" style="margin-top:5px;">
                ${worksListHtml}
              </div>
            </div>

            <div style="margin-top:10px; border-top:1px solid #ccc; padding-top:5px;">
              <button onclick="toggleVisibility('${paymentsContainerId}')" class="btn-small" style="background:#555; width:100%;">👁️ نمایش / مخفی‌سازی سوابق مالی (${barberPayments.length})</button>
              <div id="${paymentsContainerId}" class="hide" style="margin-top:5px;">
                ${paymentsListHtml}
              </div>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;

      $("#mgrFromDate").persianDatepicker({ format: "YYYY/MM/DD" });
      $("#mgrToDate").persianDatepicker({ format: "YYYY/MM/DD" });

    } catch(e) {
      container.innerHTML = `<div class="error">❌ خطا: ${e.message}<br><button onclick="showSalonReport()">تلاش مجدد</button></div>`;
    }
  }

  async function showManagerDateReport() {
    const selectedBarber = document.getElementById("mgrBarberSelect").value;
    const from = document.getElementById("mgrFromDate").value;
    const to = document.getElementById("mgrToDate").value;
    const resultBox = document.getElementById("mgrDateReportResult");

    if (!from || !to) {
      alert("لطفاً تاریخ شروع و پایان را انتخاب کنید");
      return;
    }

    const f = normalizeDate(from);
    const t = normalizeDate(to);

    const allApproved = await getAllWorks("approved");
    const filtered = allApproved.filter(w => {
      const matchBarber = (selectedBarber === "all" || w.barber === selectedBarber);
      const wDate = normalizeDate(w.date);
      return matchBarber && wDate >= f && wDate <= t;
    });

    let total = 0, count = 0;
    filtered.forEach(w => { total += w.total; count += w.services.length; });

    resultBox.innerHTML = `
      <hr>
      <div class="card" style="background:#ffffff; text-align:right;">
        📌 <strong>نتیجه گزارش (${selectedBarber === "all" ? "همه آرایشگرها" : selectedBarber}):</strong><br>
        📅 از ${from} تا ${to}<br><br>
        ✂️ تعداد خدمات: ${count}<br>
        💰 فروش کل: ${total.toLocaleString()} تومان<br>
        👤 سهم آرایشگر (۵۰٪): ${(total * 0.5).toLocaleString()} تومان<br>
        🏢 سهم سالن (۵۰٪): ${(total * 0.5).toLocaleString()} تومان
      </div>
    `;
  }

  async function updateBarberHeader() {
    const today = new Date().toLocaleDateString("fa-IR");
    const allWorks = await getBarberWorks(currentUser.name, "approved");
    const todayWorks = allWorks.filter(w => w.date === today);
    const todayMoney = todayWorks.reduce((sum, w) => sum + w.total, 0);

    const pendingWorks = await getBarberWorks(currentUser.name, "pending");
    const todayPendingWorks = pendingWorks.filter(w => w.date === today);
    const pendingClientsCount = todayPendingWorks.length;
    const pendingTotalAmount = todayPendingWorks.reduce((sum, w) => sum + (w.total || 0), 0);

    const headerElem = document.getElementById("barberHeaderCard");
    if (headerElem) {
      headerElem.innerHTML = `
        👋 سلام ${currentUser.name}<br><br>
        📅 ${today}<hr>
        👤 کارهای تأییدشده امروز: ${todayWorks.length}<br>
        💰 فروش تأییدشده امروز: ${todayMoney.toLocaleString()} تومان
      `;
    }

    const pendingCardElem = document.getElementById("barberPendingCard");
    if (pendingCardElem) {
      pendingCardElem.innerHTML = `
        <h4 style="margin-top:0; color:#e65100;">⏳ موارد در انتظار تأیید مدیر (امروز)</h4>
        👥 <strong>تعداد مشتریان در انتظار:</strong> ${pendingClientsCount} نفر<br>
        💰 <strong>مجموع مبلغ در انتظار:</strong> ${pendingTotalAmount.toLocaleString()} تومان
      `;
    }
  }

  /* --- داشبورد آرایشگر --- */
  async function loadBarber() {
    const container = document.getElementById("barberContent");
    container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
    try {
      const services = await getServices();
      const today = new Date().toLocaleDateString("fa-IR");
      
      const allWorks = await getBarberWorks(currentUser.name, "approved");
      const todayWorks = allWorks.filter(w => w.date === today);
      const todayMoney = todayWorks.reduce((sum, w) => sum + w.total, 0);

      const pendingWorks = await getBarberWorks(currentUser.name, "pending");
      const todayPendingWorks = pendingWorks.filter(w => w.date === today);
      const pendingClientsCount = todayPendingWorks.length;
      const pendingTotalAmount = todayPendingWorks.reduce((sum, w) => sum + (w.total || 0), 0);

      const totalMoneyAll = allWorks.reduce((sum, w) => sum + w.total, 0);
      const shareAll = totalMoneyAll * 0.5;
      
      const paymentsAll = await getPayments(currentUser.name);
      
      let totalPaidAll = 0;
      let totalCreditAll = 0;
      
      paymentsAll.forEach(p => {
        if (p.type === "credit") totalCreditAll += p.amount;
        else if (p.type === "penalty") totalPaidAll += Math.abs(p.amount);
        else totalPaidAll += p.amount;
      });

      const totalDebtAll = (shareAll + totalCreditAll) - totalPaidAll;

      let paymentsListHtml = "";
      if (paymentsAll.length > 0) {
        paymentsAll.forEach(p => {
          let amountText = "";
          let styleColor = "";

          if (p.type === "credit") {
            amountText = `➕ اضافه به طلب/پاداش: ${p.amount.toLocaleString()} تومان ${p.reason ? '(' + p.reason + ')' : ''}`;
            styleColor = `color: #1565c0; font-weight: bold;`;
          } else if (p.type === "penalty") {
            amountText = `🚨 جریمه: ${Math.abs(p.amount).toLocaleString()} تومان ${p.reason ? '(' + p.reason + ')' : ''}`;
            styleColor = `color: #d32f2f; font-weight: bold;`;
          } else {
            amountText = `💵 دریافتی/تسویه: ${p.amount.toLocaleString()} تومان`;
            styleColor = `color: #2e7d32;`;
          }

          paymentsListHtml += `
            <div style="font-size:12px; background:#fff; padding:6px; margin:4px 0; border-radius:5px; text-align:right;">
              <span style="${styleColor}">${amountText}</span> 
              <span style="color:#666; font-size:11px;">(${p.date || 'بدون تاریخ'})</span>
            </div>
          `;
        });
      } else {
        paymentsListHtml = "<div style='font-size:12px; color:#777;'>هیچ دریافتی یا تراکنشی ثبت نشده است</div>";
      }

      let html = `
        <div class="card" id="barberHeaderCard">
          👋 سلام ${currentUser.name}<br><br>
          📅 ${today}<hr>
          👤 کارهای تأییدشده امروز: ${todayWorks.length}<br>
          💰 فروش تأییدشده امروز: ${todayMoney.toLocaleString()} تومان
        </div>

        <div class="card" id="barberPendingCard" style="background:#fff3e0; border: 1px solid #ffe0b2; text-align:right;">
          <h4 style="margin-top:0; color:#e65100;">⏳ موارد در انتظار تأیید مدیر (امروز)</h4>
          👥 <strong>تعداد مشتریان در انتظار:</strong> ${pendingClientsCount} نفر<br>
          💰 <strong>مجموع مبلغ در انتظار:</strong> ${pendingTotalAmount.toLocaleString()} تومان
        </div>

        <h3>📝 ثبت خدمت جدید</h3>
      `;
      
      services.forEach((s, i) => {
        html += `
          <div class="card">
            <label style="cursor:pointer; display:block;">
              <input type="checkbox" id="service${i}" style="width:auto; margin-left:10px;">
              <strong>${s.name}</strong> - ${s.price.toLocaleString()} تومان
            </label>
          </div>
        `;
      });
      
      html += `
        <div class="card">
          <label><strong>➕ مبلغ اضافی / انعام (تومان):</strong></label>
          <input type="number" id="extraAmount" placeholder="مثلاً ۵۰,۰۰۰" style="margin-top:8px;">
        </div>
        <button onclick="saveWork()">✅ ثبت کار</button>
        
        <hr style="margin:20px 0; border:1px dashed #bbb;">

        <div class="card" style="background:#e8f5e9; border:1px solid #a5d6a7; text-align:right;">
          <h3>📋 حساب کلی شما (سابقه کل)</h3>
          💰 <strong>کل فروش کارکرد شما:</strong> ${totalMoneyAll.toLocaleString()} تومان<br>
          👤 <strong>کل سهم شما از کارکرد (۵۰٪):</strong> ${shareAll.toLocaleString()} تومان<br>
          ${totalCreditAll > 0 ? `➕ <strong>مبالغ اضافه شده به طلب:</strong> ${totalCreditAll.toLocaleString()} تومان<br>` : ''}
          💵 <strong>کل تسویه‌ها و پرداختی‌ها:</strong> ${totalPaidAll.toLocaleString()} تومان<hr>
          📌 <strong style="font-size:16px; color:#2e7d32;">طلب کل شما: ${totalDebtAll.toLocaleString()} تومان</strong>
          
          <div style="margin-top:10px; border-top:1px solid #ccc; padding-top:5px;">
            <button onclick="toggleVisibility('barberPaymentsHistory')" class="btn-small" style="background:#388e3c; width:100%;">👁️ نمایش / مخفی‌سازی سوابق مالی و جریمه‌ها (${paymentsAll.length})</button>
            <div id="barberPaymentsHistory" class="hide" style="margin-top:5px;">
              ${paymentsListHtml}
            </div>
          </div>
        </div>

        <div class="card">
          <h3>📅 گزارش بازه‌ای تاریخ</h3>
          <input type="text" id="fromDate" placeholder="از تاریخ">
          <input type="text" id="toDate" placeholder="تا تاریخ">
          <button onclick="showDateReport()">نمایش کارکرد بازه‌ای</button>
          <div id="dateReportResult"></div>
        </div>

        <div class="card">
          <h3>📊 گزارش امروز</h3>
          <button onclick="barberReport('day')">نمایش امروز</button>
          <div id="barberReport"></div>
        </div>
      `;
      
      container.innerHTML = html;
      $("#fromDate").persianDatepicker({ format: "YYYY/MM/DD" });
      $("#toDate").persianDatepicker({ format: "YYYY/MM/DD" });

      if (!realtimeChannel) {
        realtimeChannel = supabaseClient
          .channel('public:works_barber')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'works' }, () => {
            updateBarberHeader();
          })
          .subscribe();
      }
    } catch(e) {
      container.innerHTML = `<div class="error">❌ خطا: ${e.message}<br><button onclick="loadBarber()">تلاش مجدد</button></div>`;
    }
  }

  async function barberReport(type) {
    await updateBarberHeader();
    const today = new Date().toLocaleDateString("fa-IR");
    const works = await getBarberWorks(currentUser.name, "approved");
    const data = type === "day" ? works.filter(w => w.date === today) : works;
    
    let total = 0, count = 0;
    data.forEach(w => { total += w.total; count += w.services.length; });
    const share = total * 0.5;
    
    const payments = await getPayments(currentUser.name);
    const filteredPayments = type === "day" ? payments.filter(p => p.date === today) : payments;
    
    let paid = 0, credit = 0;
    filteredPayments.forEach(p => {
      if (p.type === "credit") credit += p.amount;
      else if (p.type === "penalty") paid += Math.abs(p.amount);
      else paid += p.amount;
    });

    const debt = (share + credit) - paid;
    
    document.getElementById("barberReport").innerHTML = `
      <div class="card">
        📊 ${type === "day" ? "گزارش امروز" : "گزارش کل"}<br><br>
        ✂️ تعداد خدمات: ${count}<br>
        💰 فروش: ${total.toLocaleString()} تومان<br>
        👤 سهم آرایشگر (۵۰٪): ${share.toLocaleString()} تومان<br>
        ${credit > 0 ? `➕ اضافه به طلب: ${credit.toLocaleString()} تومان<br>` : ''}
        💵 دریافتی/کسورات: ${paid.toLocaleString()} تومان<br>
        📌 طلب: ${debt.toLocaleString()} تومان
      </div>
    `;
  }

  async function showDateReport() {
    await updateBarberHeader();
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    const resultBox = document.getElementById("dateReportResult");

    if (!from || !to) { 
      alert("لطفاً هر دو تاریخ شروع و پایان را انتخاب کنید"); 
      return; 
    }
    
    const f = normalizeDate(from), t = normalizeDate(to);
    
    const works = await getBarberWorks(currentUser.name, "approved");
    const filteredWorks = works.filter(w => {
      const workDate = normalizeDate(w.date);
      return workDate >= f && workDate <= t;
    });
    
    const payments = await getPayments(currentUser.name);
    const filteredPayments = payments.filter(p => {
      const paymentDate = normalizeDate(p.date);
      return paymentDate >= f && paymentDate <= t;
    });

    let total = 0, count = 0, html = "";
    filteredWorks.forEach(w => {
      total += w.total;
      count += w.services.length;
      html += `<div class="card">📅 ${w.date} - ⏰ ${w.time}<br>✂️ ${w.services.map(s=>s.name).join(" - ")}<br>💰 ${w.total.toLocaleString()} تومان</div>`;
    });
    
    const share = total * 0.5;
    
    let paid = 0, credit = 0;
    filteredPayments.forEach(p => {
      if (p.type === "credit") credit += p.amount;
      else if (p.type === "penalty") paid += Math.abs(p.amount);
      else paid += p.amount;
    });

    const debt = (share + credit) - paid;

    resultBox.innerHTML = `
      <hr>
      <div class="card" style="background:#e8f5e9; text-align:right;">
        📌 <strong>نتیجه گزارش (${from} تا ${to}):</strong><br><br>
        ✂️ تعداد خدمات: ${count}<br>
        💰 فروش کل: ${total.toLocaleString()} تومان<br>
        👤 سهم آرایشگر (۵۰٪): ${share.toLocaleString()} تومان<br>
        ${credit > 0 ? `➕ اضافه به طلب در این بازه: ${credit.toLocaleString()} تومان<br>` : ''}
        💵 دریافتی/کسورات در این بازه: ${paid.toLocaleString()} تومان<hr>
        📌 <strong>مانده طلب در این بازه: ${debt.toLocaleString()} تومان</strong>
      </div>
      ${filteredWorks.length > 0 ? html : '<div class="card">هیچ کار تأییدشده‌ای در این بازه یافت نشد.</div>'}
    `;
  }
</script>
